server {
    listen 80;
    server_name _;

    root /opt/pet-agent/frontend/dist;
    index index.html;

    # Vlog allows one 20 MiB video. Leave room for multipart headers and fields.
    location = /api/v1/vlogs {
        client_max_body_size 21m;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
    }

    # 前端是单页应用，路由刷新时回退到 index.html
    location / {
        try_files $uri /index.html;
    }
}
